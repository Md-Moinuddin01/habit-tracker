<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Simple Habit Tracker</p>
        <h1>Build better habits, one day at a time.</h1>
      </div>

      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light and dark mode">
        <span class="theme-icon" id="themeIcon">L</span>
        <span id="themeLabel">Light Mode</span>
      </button>
    </header>

    
    <main>
      <section class="hero card">
        <div class="hero-text">
          <h2 id="greeting">Good day!</h2>
          <p id="todayDate" class="date-text"></p>
          <p class="hero-note">Track your habits, stay consistent, and keep your routine simple.</p>
        </div>

        <div class="quote-box">
          <p class="quote-label">Daily Quote</p>
          <p id="motivationalQuote">One habit at a time.</p>
        </div>
      </section>
      
   <section class="card controls">
        <div class="input-row">
          <label class="sr-only" for="habitInput">New habit</label>
          <input type="text" id="habitInput" placeholder="Enter a new habit...">
          <button id="addHabitBtn" type="button">Add Habit</button>
        </div>

        <div class="filter-row">
          <label class="sr-only" for="searchInput">Search habits</label>
          <input type="text" id="searchInput" placeholder="Search habits...">

          <div class="filter-buttons" role="tablist" aria-label="Habit filters">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="completed" type="button">Completed</button>
            <button class="filter-btn" data-filter="pending" type="button">Pending</button>
          </div>
        </div>
      </section>
